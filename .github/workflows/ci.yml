name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make git cmake protobuf-compiler
      - name: check
        uses: actions-rs/cargo@v1
        with:
          command: check
      - name: fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          toolchain: nightly
          args: --all -- --check
      - name: clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          toolchain: nightly
          args: -- -D warnings
      - name: test core
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p lancelot
      - name: test flirt
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p lancelot-flirt
      - name: test pylancelot
        working-directory: ./pylancelot/
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip setuptools maturin pytest pefile
          maturin develop
          pytest
      - name: test pyflirt
        working-directory: ./pyflirt/
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip setuptools maturin pytest pefile
          maturin develop
          pytest

  wasm:
    name: wasm
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          # jslancelot tests use pylancelot's LFS-tracked test fixtures
          lfs: true
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git cmake clang protobuf-compiler
          rustup target add wasm32-unknown-unknown
      - name: build core for wasm32-unknown-unknown
        run: |
          CMAKE_TOOLCHAIN_FILE=$(pwd)/wasm32-toolchain.cmake \
            cargo build -p lancelot --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v2
      - name: install wasm-bindgen-cli
        # keep this version in sync with the wasm-bindgen pin in jslancelot/Cargo.toml
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: test jslancelot
        working-directory: ./jslancelot/
        run: |
          just build
          just test
