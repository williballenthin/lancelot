[package]
name = "jslancelot"
version = "0.10.1"
authors = ["Willi Ballenthin <william.ballenthin@mandiant.com>"]
edition = "2021"
homepage = "https://github.com/williballenthin/lancelot"
repository = "https://github.com/williballenthin/lancelot"
# published to npm (as `jslancelot`), not to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lancelot = { path = "../core", version = "0.10.1" }
lancelot-flirt = { path = "../flirt", version = "0.10.1" }
anyhow = "1"
sha2 = "0.10"

# keep this version in sync with the wasm-bindgen-cli invoked by build.sh,
# since the CLI refuses to process wasm built against a different version.
wasm-bindgen = "=0.2.100"
js-sys = "0.3"

# the core library stamps the export with chrono::Utc::now(), which panics on
# wasm32-unknown-unknown unless chrono's `wasmbind` feature routes it through
# the JS Date API. depending on chrono here enables that feature for the whole
# build via feature unification.
chrono = { version = "0.4", features = ["clock", "wasmbind"], default-features = false }

# readable panic messages in the browser console instead of "unreachable executed"
console_error_panic_hook = "0.1"
