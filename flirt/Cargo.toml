[package]
name = "lancelot-flirt"
description = "parse and match FLIRT signatures"
license = "Apache-2.0"
version = "0.10.0"
authors = ["Willi Ballenthin <william.ballenthin@mandiant.com>"]
edition = "2021"
homepage = "https://github.com/williballenthin/lancelot"
repository = "https://github.com/williballenthin/lancelot"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
nom = "7"
regex = "1.3"
bitvec = "1"
inflate = "0.4"
anyhow = "1"
thiserror = "2"
bitflags = "2"
smallvec = "1"

# only used by the helper binaries (sig2pat, parsepat, decompress_sig),
# gated behind the `cli` feature so that library consumers -- including
# the wasm build via the core crate -- don't pull them in.
clap = { version = "4", optional = true }
fern = { version = "0.7", optional = true }
chrono = { version = "0.4", features = ["std", "clock"], default-features = false, optional = true }
better-panic = { version = "0.3", optional = true }

[features]
cli = ["dep:clap", "dep:fern", "dep:chrono", "dep:better-panic"]

[[bin]]
name = "sig2pat"
required-features = ["cli"]

[[bin]]
name = "parsepat"
required-features = ["cli"]

[[bin]]
name = "decompress_sig"
required-features = ["cli"]

[dev-dependencies]
criterion = "0.5"
# used by test helpers (init_logging)
fern = "0.7"
chrono = { version = "0.4", features = ["std", "clock"], default-features = false }

[[bench]]
name = "regex"
harness = false

